name: CI

on:
    push:
        branches: [main, develop, beta]
    pull_request:
        branches: [main, develop, beta]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Public Sanity identifiers (shipped in the browser bundle, not secrets).
# The build prerenders Sanity-driven pages and the E2E dev server reads the
# same dataset, so both jobs need them to boot.
env:
    NEXT_PUBLIC_SANITY_PROJECT_ID: jau3o5v4
    NEXT_PUBLIC_SANITY_DATASET: production

jobs:
    ci:
        name: Lint, Typecheck, Test, Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test

            - name: Build
              run: pnpm build

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E tests
              run: pnpm test:e2e

            - name: Upload Playwright report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
